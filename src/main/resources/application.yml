spring:
  application:
    name: employee-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/employees}
    username: ${DB_USER:employee_app}
    password: ${DB_PASSWORD:employee_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
